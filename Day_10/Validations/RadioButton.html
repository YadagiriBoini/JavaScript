<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <center>
        <fieldset>
            <legend>DOM</legend>
            <center>
                <hr>
                <table border="2">
                    <form action="" method="post" onsubmit="return display()">

                       <tr>
                        <td><label>Gender: </label></td>
                        <td><input type="radio" name="gender" value="male">
                            <label>Male</label>
                            <input type="radio" name="gender" value="female">
                            <label>Female</label>
                        </td>
                        <td><span id="A"></span></td>
                       </tr>

                       <tr><td></td>
                        <td><input type="submit" value="Validate">
                            <input type="reset" value="Reset"></td>
                       </tr>


                    </form>
                </table>
                <hr>
            </center>
        </fieldset>
    </center>

    <script>

        function display(){
            let my_gender = document.getElementsByName("gender")

            if( my_gender[0].checked==false && my_gender[1].checked==false){
                document.getElementById("A").innerHTML="Select the gender"
            }
            return false
        }


    </script>
</body>
</html>
