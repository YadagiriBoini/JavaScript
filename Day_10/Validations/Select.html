<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <center>
        <fieldset>
            <legend>DOM</legend>
            <center>
                <hr>
                <table border="2">
                    <form action="" method="post" onsubmit="return display()">

                       <tr>
                        <td><label>City/state/Country</label></td>
                        <td>
                            <select name="" id="A">
                                <option>City</option>
                                <option>Hyd</option>
                                <option>Mbi</option>
                                <option>Beg</option>
                                <option>Dlh</option>
                            </select>
                            <select name="" id="B">
                                <option>State</option>
                                <option>TG</option>
                                <option>MH</option>
                                <option>KA</option>
                                <option>DH</option>
                            </select>
                            <select name="" id="C">
                                <option>Country</option>
                                <option>In</option>
                                <option>US</option>
                                <option>UK</option>
                                <option>AUS</option>
                            </select>
                        </td>
                       </tr>
                       <tr>
                        <td>
                            <input type="submit" value="Submit">
                            <input type="reset" value="Reset">
                        </td>
                        <td><span id="ABC"></span></td>
                       </tr>      

                    </form>
                </table>
                <hr>
            </center>
        </fieldset>
    </center>

    <script>

        function display(){
            let city = document.getElementById("A")
            let state = document.getElementById("B")
            let country = document.getElementById("C")

            if(city.selectedIndex===0){
                document.getElementById("ABC").innerHTML="Select City"
                return false
            }else if(state.selectedIndex===0){
                document.getElementById("ABC").innerHTML="Select Satet"
                return false
            }else if(country.selectedIndex===0){
                document.getElementById("ABC").innerHTML="Select Country"
                return false
            }
        }


    </script>
</body>
</html>
