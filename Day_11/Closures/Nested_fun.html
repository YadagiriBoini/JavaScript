<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js</title>
</head>
<body>
    <hr>
    <center>
        <h1>Nested_Functions</h1>
    </center>
    <hr>
    
    <script>

        function OuterFun(){
            document.write("This is  Outer Function<br>")

            function InnerFun(){
                document.write("This is Inner Function")
            }
            InnerFun()
        }
        OuterFun()

    </script>
</body>
</html>
