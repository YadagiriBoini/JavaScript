<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
</head>
<body>
    <hr>
    <center>
        <h1>Map Function</h1>
    </center>
    <hr>
    
    <script>
        const ages=[12,23,34,45,56,67,89]

        let new_ages = ages.map( function(x){
            return x+5
        })
        document.write("Age after 5 years: ",new_ages)

    </script>
</body>
</html>
