<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
</head>
<body>
    <hr><center><h1>OOPS</h1></center><hr>
    
    <script>

        class A{
            constructor(name){
                this.name = name
            }
        }
        let a1 = new A("JS")
        let a2 = new A("Python")
        document.write("This is a parameterized constructor in "+a1.name+"<br>")
        document.write("This is a parameterized constructor in "+a2.name+"<br>")

    </script>
</body>
</html>
