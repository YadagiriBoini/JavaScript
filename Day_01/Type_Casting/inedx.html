<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    
    <hr>
    <center><h1>JavaScript</h1></center>
    <hr>


    <script>


       let a = parseInt(window.prompt("Enter the value of a: "));
       let b = parseFloat(window.prompt("Enter the value of b: "));      // by default take the string as input value
       let c = Number(window.prompt("Enter value of c: "));
       let d = a+b+c;
       document.write("Ans is: "+d)                        // string concatination 
       document.write("<br>")
       document.write("Type of the variable a is: ",typeof(a));
       document.write("<br>")
       document.write("Type of the variable b is: ",typeof(b));
       document.write("<br>")
       document.write("Type of the variable c is: ",typeof(c));
       document.write("<br>")
       document.write("Type of the variable d is: ",typeof(d));




    </script>


</body>
</html>
