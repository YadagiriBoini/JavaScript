<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js</title>
</head>
<body>
    <h1>
        <center>
            JavaScript
        </center>
    </h1><hr>

    <script>

        let email = window.prompt("Enter Email: ")
        let res1 = email.match(/A{2,3}/g)               // min 2 A's max # A's    if more divide into parts
        
        if(res1!=null){
            document.write("Min2 mmax3 A's: ",res1)    // only Capital
            document.write("<br>")
            document.write(res1.length)
        }else{
            document.write("Not Present")
        }

    </script>
</body>
</html>
