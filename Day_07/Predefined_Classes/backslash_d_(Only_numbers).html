<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jst</title>
</head>
<body>
    <h1>
        <center>
            JavaScript
        </center>
    </h1><hr>

    <script>

        let email = window.prompt("Enter Email: ")
        let res1 = email.match(/\d/g)               // prints only nnumbers
        
        if(res1!=null){
            document.write("prints only numbers: ",res1)
            document.write("<br>")
            document.write(res1.length)
        }else{
            document.write("Not Present")
        }

    </script>
</body>
</html>
