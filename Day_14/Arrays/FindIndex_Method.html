<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
</head>
<body>
    <hr><center><h1>JavaScript</h1></center><hr>

    <script>

        
    let nums = [22,33,44,55,66]
    let result = nums.findIndex(nums => nums>25 )   // First element's index that satisfies a given condition
    let result1 = nums.findIndex( nums => nums>100 )  // -1

    document.write(result,"<br>")
    document.write(result1)

    </script>
</body>
</html>
