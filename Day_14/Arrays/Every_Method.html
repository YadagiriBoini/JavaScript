<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
</head>
<body>
    <hr><center><h1>JavaScript</h1></center><hr>

    <script>

        
    let nums = [22,33,44,55,66]
    let result = nums.every(nums => nums>25 )   // Return Bool if satisfies a given condition for all the elements in an array
    let result1 = nums.every( nums => nums<100 )  // bool

    document.write(result,"<br>")
    document.write(result1)

    </script>
</body>
</html>
