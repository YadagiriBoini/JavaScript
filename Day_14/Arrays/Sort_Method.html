<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
</head>
<body>
    <hr><center><h1>JavaScript</h1></center><hr>

    <script>

        
    let languages = ["Python", "JavaScript", "Java"];
    languages.sort()            // sorts the elements of an array in place
    document.write(languages,"<br>")


    let numbers = [10, 5, 20, 2];
    numbers.sort( (a,b)=>a-b)    // converts values to strings and sorts them lexicographically.
    document.write(numbers)

    </script>
</body>
</html>
