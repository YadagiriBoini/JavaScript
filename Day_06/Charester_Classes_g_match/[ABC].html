<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <body>
    <hr />
    <center>
      <h1>JavaScript</h1>
    </center>
    <hr />

    <script>

        let str1 = window.prompt("Enter the pattern: ");
        let res1 = str1.match(/[ABC]/g)

        if(res1 != null){
            document.write("Matched: ",res1,"<br>")    // return multiple matched A,B,C
            document.write(res1.length)
        }else{
            document.write("Not Matched")
        }

    </script>
  </body>
</html>
