<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <body>
    <hr />
    <center>
      <h1>JavaScript</h1>
    </center>
    <hr />

    <script>

        for(let i=0;i<11;i++){
            document.write(i,"<br>")
            if(i==5){
                break
            }
        }


        let a=window.prompt("Enter: ")
        let b= JSON.parse(a)
        document.write(b+typeof(b))

    </script>
  </body>
</html>
