<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <body>
    <hr />
    <center>
      <h1>JavaScript</h1>
    </center>
    <hr />

    <script>

        let grade = window.prompt("Enter the Grade: ");
        switch(grade){
            case 'A':
                document.write("First Class<br>");
                break
            case 'B':
                document.write("Second Class<br>");
                break
            case 'C':
                document.write("Third Class<br>");
                break
            default:
                document.write("Fail");
        }

    </script>
  </body>
</html>
