<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <body>
    <hr />
    <center>
      <h1>JavaScript</h1>
    </center>
    <hr />

    <script>

        for(let i=1;i<11;i++){
            if(i==5){
                document.write("FIVE<br>")
                continue
            }
            document.write(i,"<br>")
        }

    </script>
  </body>
</html>
