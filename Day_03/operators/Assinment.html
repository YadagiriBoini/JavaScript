<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <hr>
    <center>
        <h1>JavaScript</h1>
    </center>
    <hr>

    <script>

        let a = Number(window.prompt("Enter value: "));
        let b = Number(window.prompt("Enter Value: "));
        a+=b
        document.write("Addition:",a);
        document.write("<br>");
        a-=b
        document.write("Subtrction:",a);
        document.write("<br>");
        a*=b
        document.write("Multiplication:",a);
        document.write("<br>");
        a/=b
        document.write("Division:",a);
        document.write("<br>");
        a%=b
        document.write("Modulo:",a);
        document.write("<br>");
        a**=b
        document.write("Exponent:",a);
        document.write("<br>");

    </script>
</body>
</html>
