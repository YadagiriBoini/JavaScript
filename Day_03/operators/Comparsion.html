<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <hr>
    <center>
        <h1>JavaScript</h1>
    </center>
    <hr>

    <script>

        let a = Number(window.prompt("Enter value: "));
        let b = Number(window.prompt("Enter Value: "));

        let res1 = a>b;
        let res2 = a<b;

        let res3 = a<=b;
        let res4 = a>= b;

        let res5 = a==b;
        let res6 = a!=b;

        let res7 = a===b;
        let res8 = a!==b;

        document.write(res1,typeof(res1));
        document.write("<br>");
        document.write(res2,typeof(res2));
        document.write("<br>");
        document.write(res3);
        document.write("<br>");
        document.write(res4);
        document.write("<br>");
        document.write(res5);
        document.write("<br>");
        document.write(res6);
        document.write("<br>");
        document.write(res7);
        document.write("<br>");
        document.write(res8);
        document.write("<br>");

    </script>
</body>
</html>
