<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <hr>
    <center>
        <h1>JavaScript</h1>
    </center>
    <hr>

    <script>

        let a = 10
        let b = 20

        if (a==10 && b==20){
            document.write("Both are True (Logical AND)");
            document.write("<br>")
        }

        if (a==10 || b==20){
            document.write("One of them is True (Logical OR)");
            document.write("<br>")
        }

        let c = true
        let d = !c
        document.write(c+" ",typeof(c))
        document.write("<br>")
        document.write(d+"  ",typeof(d))
    </script>
</body>
</html>
