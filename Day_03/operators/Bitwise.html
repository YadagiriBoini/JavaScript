<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <hr>
    <center>
        <h1>JavaScript</h1>
    </center>
    <hr>

    <script>
        // Bitiwse and
        document.write( 4 & 5 )
        document.write("<br>")

        // Bitwise or
        document.write( 4 | 5 )
        document.write("<br>")

        // Biwise Exculsivce or 
        document.write( 4 ^ 5)
        document.write("<br>")

        // Bitwise Complement
        document.write(~4)
        document.write("<br>")

        // Biwise left shift
        document.write(20<<2)
        document.write("<br>")

        // Bitwise right shift
        document.write(20>>2)
        document.write("<br>")
    </script>
</body>
</html>
