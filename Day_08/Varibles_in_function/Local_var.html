<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Js</title>
  </head>
  <body>
    <h1>
      <center>JavaScript</center>
    </h1>
    <hr />

    <script>
      function t1() {
        let a = 10; // Local variable ( inside the function )
        document.write(a, "<br>");
      }

      function t2() {
        document.write(a); // can't ne accessed
      }

      t1();
      t2();
    </script>
  </body>
</html>
