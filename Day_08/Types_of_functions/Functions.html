<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js</title>
</head>
<body>
    <h1>
        <center>
            JavaScript
        </center>
    </h1><hr>

    <script>

        function greet1(){
            document.write("NameFull function");
            document.write("<br>");
        }


        let greet2 = function(){
            document.write("NameLess function");
            document.write("<br>");
        }


        const greet = () => {
            document.write("Arrow function")
        } 

        
        greet1()
        greet2()
        greet()

    </script>
</body>
</html>
