<!DOCTYPE html>
<html lang="en">
<head>

    <title>JavaScript</title>
</head>
<body>
    <hr>
    <center>
        <h1>JavaScript</h1>
    </center>
    <hr>

    <script>

        let fname = window.prompt("Enter First name: ");
        let lname = window.prompt("Enter last name: ");

        if(fname=="B"){
            document.write("Outer Loop");
            document.write("<br>");

            if(lname=="Yadagiri"){
                document.write("Inner Loop")
                document.write("<br>");
                document.write("Boini Yadagiri");

            }
        }

    </script>
</body>
