<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <hr>
    <center>
        <h1>JavaScript</h1>
    </center>
    <hr>

    <script>

        let a = window.prompt("Enter the value: ");

        if(a=="x"){
            document.write("If Block");
            document.write("<br>");
        }
        else if(a=="y"){
            document.write("Else-If Block");
            document.write("<br>");
        }
        else{
            document.write("Else Block")
        }
        

    </script>
</body>
</html>
