<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <body>
    <hr />
    <center>
      <h1>JavaScript</h1>
    </center>
    <hr />

    <script>
      for (let i = 1; i < 11; i++) {
        document.write(i);
        document.write("<br>");
      }

      document.write("<br>");

      let ages = [2, 3, 4, 5, 7];
      for (let j = 0; j < ages.length; j++) {
        document.write(j, " ", ages[j]);
        document.write("<br>");
      }
    </script>
  </body>
</html>
