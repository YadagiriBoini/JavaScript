<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <body>
    <hr />
    <center>
      <h1>JavaScript</h1>
    </center>
    <hr />

    <script>

        let x=1
        while (x<6){
            document.write("<br>")
            document.write(x);
            document.write("<br>")
            let y=5
            while(y>0){
                document.write(y);
                y--;
            }
            x++;
        }

    </script>
  </body>
</html>
