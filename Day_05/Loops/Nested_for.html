<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <body>
    <hr />
    <center>
      <h1>JavaScript</h1>
    </center>
    <hr />

    <script>

        for( let i=0; i<5; i++){
            document.write("<br>")
            document.write(i);
            document.write("<br>")
            for(let j=5; j>0; j--){
                document.write(j)
                
            }
        }

    </script>
  </body>
