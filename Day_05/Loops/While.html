<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <body>
    <hr />
    <center>
      <h1>JavaScript</h1>
    </center>
    <hr />

    <script>

        let a=1
        while( a<11 ){
            document.write(a,"<br>")
            a++;
        }

        let ages=[20,21,22,23,24,25]
        let b=0
        while(b<ages.length){
            if(ages[b]%2==0){
                document.write(ages[b],"<br>");
            }
            b++;
        }

    </script>
  </body>
</html>
