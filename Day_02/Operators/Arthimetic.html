<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <script>

        let a = 10;
        let b = 20;
        document.write("Add: ",a+b);
        document.write("<br>");
        document.write("sub: ",a-b);
        document.write("<br>");
        document.write("multi: ",a*b);
        document.write("<br>");
        document.write("div: ",a/b);
        document.write("<br>");
        document.write("mod: ",a%b);
        document.write("<br>");
        document.write("exp: ",a**b);
        document.write("<br>");
        document.write("inc: ",a++);
        document.write("<br>");
        document.write("Dec: ",a--);
        document.write("<br>");
        document.write("inc: ",++a);
        document.write("<br>");
        document.write("Dec: ",--a);
        document.write("<br>");


    </script>
</body>
</html>
